name: Build and Deploy

on:
  push:
    branches:
      - v2

permissions:
  contents: write

env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Buster
        run: |
          sed -i "s/__DEPLOY_RUN_NUMBER__/${GITHUB_RUN_NUMBER}/g" ./public/index.html
          cat ./public/index.html
      - name: Install and Build
        run: |
          npm install
          npm run build
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.39.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "metrajay-worker"
